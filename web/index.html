<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entreaguas Resto Bar — recorrido 3D</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <canvas id="stage" aria-label="Modelo 3D de Entreaguas Resto Bar. Arrastra para girar."></canvas>
  <img id="render" alt="" draggable="false">
  <video id="orbit" muted playsinline preload="auto" aria-label="Fachada: arrastra para rodearla"></video>

  <header id="top" hidden>
    <div class="brand">
      <h1>Entreaguas</h1>
      <p>Resto Bar · recorrido 3D</p>
    </div>
    <div id="floors" class="segmented" role="group" aria-label="Piso"></div>
  </header>

  <div id="view-bar" hidden>
    <button id="prev-view" type="button" aria-label="Vista anterior">‹</button>
    <span id="view-name"></span>
    <button id="next-view" type="button" aria-label="Vista siguiente">›</button>
    <button id="enter-3d" type="button">Recorrer en 3D</button>
    <button id="toggle" type="button" aria-pressed="true">Ver modelo</button>
    <button id="close-view" type="button">Recorrer libre</button>
  </div>

  <p id="orbit-hint" hidden>Arrastra la imagen para rodear la fachada</p>
  <p id="hint" hidden>Arrastra para girar · pellizca o rueda para acercar</p>
  <nav id="strip" aria-label="Vistas de los renders" hidden></nav>

  <div id="loading" role="status" aria-live="polite">
    <p id="loading-text">Cargando…</p>
    <div class="bar"><div id="loading-bar"></div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
